services:
  - type: web
    name: ran-voice-agent
    runtime: node
    rootDir: voice-server
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: GEMINI_VOICE
        value: Aoede
